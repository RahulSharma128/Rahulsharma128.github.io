<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minimalist Interactive Hero Layout generated from Stitch project.">
    <title>Stitch Screen 2 — Minimalist Interactive Hero Layout</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .screen-view-badge {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .screen-view-badge a {
            color: #0f172a;
            text-decoration: none;
        }

        .bg-watermark {
            position: absolute;
            font-size: 18vw;
            font-weight: 900;
            color: rgba(15, 23, 42, 0.035);
            letter-spacing: 15px;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            bottom: 5%;
        }

        .brand-logo-badge {
            width: 48px;
            height: 48px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.06);
            font-weight: 800;
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 20px;
            z-index: 10;
        }

        .greeting-tag {
            font-size: 1.1rem;
            color: #475569;
            font-weight: 500;
            margin-bottom: 8px;
            z-index: 10;
        }

        .main-headline {
            font-size: 3.5rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 30px 0;
            letter-spacing: -1.5px;
            z-index: 10;
            text-align: center;
        }

        .avatar-memoji-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 4px solid #ffffff;
            margin-bottom: 35px;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        .avatar-memoji-container:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .avatar-memoji-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ai-search-box {
            width: 90%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 50px;
            padding: 8px 12px 8px 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            z-index: 10;
            margin-bottom: 45px;
            transition: box-shadow 0.25s, border-color 0.25s;
        }

        .ai-search-box:focus-within {
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.12);
            border-color: #3b82f6;
        }

        .ai-search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            color: #0f172a;
            font-family: inherit;
        }

        .ai-search-box input::placeholder {
            color: #94a3b8;
        }

        .ai-search-btn {
            width: 40px;
            height: 40px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .ai-search-btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        .bottom-dock-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #64748b;
            padding: 10px 18px;
            border-radius: 14px;
            transition: all 0.2s;
            font-size: 0.8rem;
            font-weight: 500;
            gap: 6px;
            min-width: 60px;
        }

        .dock-item i {
            font-size: 1.25rem;
            color: #64748b;
            transition: color 0.2s, transform 0.2s;
        }

        .dock-item:hover, .dock-item.active {
            background: rgba(241, 245, 249, 0.8);
            color: #0f172a;
        }

        .dock-item:hover i, .dock-item.active i {
            color: #2563eb;
            transform: translateY(-2px);
        }

        .ai-response-toast {
            display: none;
            position: fixed;
            bottom: 120px;
            background: #0f172a;
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 0.9rem;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 100;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .main-headline { font-size: 2.5rem; }
            .bottom-dock-nav { gap: 4px; padding: 6px; }
            .dock-item { padding: 8px 10px; min-width: auto; }
        }
    </style>
</head>

<body>
    <!-- Top Return Link -->
    <div class="screen-view-badge">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Portfolio</a>
        <span>| Stitch Screen 2</span>
    </div>

    <!-- Giant Watermark -->
    <div class="bg-watermark">RAHUL</div>

    <!-- Brand Logo Icon -->
    <div class="brand-logo-badge">R</div>

    <!-- Greeting & Title -->
    <div class="greeting-tag">Hey, I'm Rahul 👋</div>
    <h1 class="main-headline">Full-Stack Developer</h1>

    <!-- 3D Avatar Memoji -->
    <div class="avatar-memoji-container">
        <img src="assets/memoji_avatar.jpg" alt="Rahul 3D Avatar">
    </div>

    <!-- AI Search Input Box -->
    <form class="ai-search-box" id="aiSearchForm" onsubmit="handleAISearch(event)">
        <input type="text" id="aiInput" placeholder="Ask me anything..." autocomplete="off">
        <button type="submit" class="ai-search-btn" title="Submit Question">
            <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <!-- Bottom Dock Menu -->
    <nav class="bottom-dock-nav">
        <a href="index.html#about" class="dock-item">
            <i class="fas fa-user-circle"></i>
            <span>About</span>
        </a>
        <a href="index.html#projects" class="dock-item">
            <i class="fas fa-layer-group"></i>
            <span>Projects</span>
        </a>
        <a href="index.html#skills" class="dock-item">
            <i class="fas fa-code"></i>
            <span>Skills</span>
        </a>
        <a href="index.html#experience" class="dock-item">
            <i class="fas fa-briefcase"></i>
            <span>Experience</span>
        </a>
        <a href="index.html#contact" class="dock-item">
            <i class="fas fa-paper-plane"></i>
            <span>Contact</span>
        </a>
    </nav>

    <!-- AI Response Toast -->
    <div class="ai-response-toast" id="aiToast"></div>

    <script>
        function handleAISearch(e) {
            e.preventDefault();
            const input = document.getElementById('aiInput');
            const toast = document.getElementById('aiToast');
            const q = input.value.trim().toLowerCase();
            if (!q) return;

            let reply = "Rahul is a Full-Stack Developer skilled in Node.js, React, Next.js, and microservices!";
            if (q.includes('skill') || q.includes('tech')) {
                reply = "Rahul's core skills include MERN Stack, React.js, Node.js, TypeScript, Next.js, WebSocket, and Cloud Architecture.";
            } else if (q.includes('project') || q.includes('work')) {
                reply = "Featured projects: Drone Fleet GCS, PathSynq PWA Sensor App, Admin & Partner Dashboards.";
            } else if (q.includes('contact') || q.includes('email') || q.includes('hire')) {
                reply = "You can reach Rahul at shrahul520@gmail.com or +91-8955102520.";
            } else if (q.includes('experience') || q.includes('job')) {
                reply = "Rahul has extensive experience as a Full Stack Engineer at Smartgenx, Volyo Solutions, and Emvirt Solutions.";
            }

            toast.innerText = reply;
            toast.style.display = 'block';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
